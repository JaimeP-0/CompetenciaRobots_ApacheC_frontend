# Front Cordova (www) + proxy API Go en 127.0.0.1:8080
# HTTPS: Let's Encrypt en /etc/letsencrypt/live/utarena.online/

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name utarena.online www.utarena.online;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name utarena.online www.utarena.online;

    ssl_certificate /etc/letsencrypt/live/utarena.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/utarena.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/competencia-robots/www;
    index index.html;

    client_max_body_size 16m;

    # Dashboard Postgres (Adminer) — ruta oculta + auth HTTP (no va al API Go).
    location ^~ /cr-internal/db-console-q8m2/ {
        if ($args = "") {
            return 302 /cr-internal/db-console-q8m2/?pgsql=robot-postgres&username=robot&db=robot&ns=public;
        }

        set $adminer_rewrite 0;
        if ($arg_server != "") {
            set $adminer_rewrite 1;
        }
        if ($arg_pgsql != "") {
            set $adminer_rewrite 0;
        }
        if ($adminer_rewrite = 1) {
            return 302 /cr-internal/db-console-q8m2/;
        }

        auth_basic "CR DB Admin";
        auth_basic_user_file /etc/nginx/cr-db-admin.htpasswd;
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /cr-internal/db-console-q8m2;
        proxy_redirect / /cr-internal/db-console-q8m2/;
    }

    # API Go (mismas rutas que scripts/api-proxy-paths.cjs)
    location ~ ^/(categorias|equipos|reglas|miembros|robots|registro|validaciones|partidas|resultados|brackets|login|cr-internal)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Estáticos reales: no devolver index.html si falta un .js
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # SPA Cordova — rutas limpias sin index.html en la URL
    location / {
        try_files $uri $uri/ /index.html;
    }
}
