<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Competencia de Robots</title>
        <link rel="icon" href="img/icon.png" type="image/png" sizes="any" />
        <link rel="apple-touch-icon" href="img/icon.png" />
        <link rel="stylesheet" href="css/app.css">
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval'; connect-src 'self' https: http:; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;"
        />

    </head>
    <body
        class="cr-view-inicio m-0 flex min-h-dvh flex-col overflow-x-hidden bg-[#f5f7fb] px-3 pb-3 pt-[max(2rem,env(safe-area-inset-top,0px))] text-base text-[#1f2937] antialiased sm:px-5 sm:pb-5 sm:pt-[max(2rem,env(safe-area-inset-top,0px))] lg:px-8 lg:pb-8"
    >

            <img
                id="cr-site-logo"
                src="img/logo_utnc.png"
                alt="Universidad Tecnológica del Norte de Coahuila"
                class="block h-auto w-auto max-w-[min(100%,11rem)] sm:max-w-[13rem] lg:max-w-[15rem]"
                decoding="async"
            />
        </header>
        <div
            id="cr-outlet"
            class="mx-auto flex w-full min-h-0 min-w-0 max-w-full flex-1 flex-col px-0 sm:max-w-[min(100%,1100px)] sm:px-2 lg:px-4"
        ></div>
        <script src="cordova.js"></script>
        <!-- Overrides locales primero; luego config principal -->
        <script src="js/config.local.js"></script>
        <script src="js/config.js"></script>
        <script src="js/routes.js"></script>
        <!-- API (orden fijo) -->
        <script src="js/api/http-build-url.js"></script>
        <script src="js/api/http-transport.js"></script>
        <script src="js/api/categorias-cache.js"></script>
        <script src="js/api/equipos-registro-cache.js"></script>
        <script src="js/api/catalog-remoto-get.js"></script>
        <script src="js/api/request.js"></script>
        <script src="js/core/team-origin.js"></script>
        <script src="js/core/queue-routes.js"></script>
        <script src="js/core/categorias-competencia.js"></script>
        <script src="js/api/partidas.js"></script>
        <script src="js/api/matchmaking.js"></script>
        <script src="js/api/public.js"></script>
        <script src="js/api/admin-remoto.js"></script>
        <script src="js/admin/almacen.js"></script>
        <!-- Catálogo (consulta) -->
        <script src="js/core/escape-html.js"></script>
        <script src="js/core/skeleton-html.js"></script>
        <script src="js/core/icons.js"></script>
        <script src="js/catalog/vista-inicio.js"></script>
        <script src="js/catalog/vista-categorias.js"></script>
        <script src="js/catalog/vista-categoria-detalle.js"></script>
        <script src="js/catalog/vista-equipos-lista.js"></script>
        <script src="js/catalog/vista-equipo-detalle.js"></script>
        <script src="js/catalog/vista-validados.js"></script>
        <script src="js/catalog/vista-match.js"></script>
        <script src="js/auth/staff-sesion.js"></script>
        <script src="js/auth/staff-auth.js"></script>
        <script src="js/catalog/vista-visitante.js"></script>
        <script src="js/catalog/vista-login-staff.js"></script>
        <script src="js/catalog/vista-diag-feed.js"></script>
        <script src="js/catalog/vista-ranking.js"></script>
        <script src="js/catalog/catalog.js"></script>
        <!-- Núcleo app -->
        <script src="js/core/nav-history.js"></script>
        <script src="js/core/util.js"></script>
        <script src="js/core/views.js"></script>
        <script src="js/core/router.js"></script>
        <!-- Registro (jueces): solo se carga al abrir #/registro → js/registro/cargar.js -->
        <script src="js/registro/cargar.js"></script>
        <!-- Administración -->
        <script src="js/admin/sesion.js"></script>
        <script src="js/admin/nav.js"></script>
        <script src="js/admin/login-mock.js"></script>
        <script src="js/admin/vista-login.js"></script>
        <script src="js/admin/vista-panel.js"></script>
        <script src="js/admin/vista-categorias.js"></script>
        <script src="js/admin/vista-equipos.js"></script>
        <script src="js/admin/admin.js"></script>
        <script src="js/app.js"></script>

</html>
