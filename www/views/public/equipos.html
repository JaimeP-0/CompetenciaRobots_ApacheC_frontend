<section id="cr-equipos-root" class="cr-catalog-page cr-catalog-page--inner cr-catalog-page--wide" aria-label="Listado de equipos">
    <button id="cr-equipos-volver" type="button" data-back data-back-fallback="/categorias" class="cr-catalog-back" aria-label="Volver">←</button>

    <header class="cr-page-head">
        <p class="cr-page-kicker">Consultar</p>
        <h1 id="cr-equipos-titulo" class="cr-page-title">Equipos</h1>
        <p id="cr-equipos-sub" class="cr-page-lead"></p>
    </header>

    <div class="cr-match-setup-card shrink-0">
        <div class="cr-match-field">
            <label for="cr-equipos-filtro-categoria" class="cr-admin-label">Categoría</label>
            <select
                id="cr-equipos-filtro-categoria"
                class="cr-admin-select cr-equipos-filtro-cat w-full max-w-full"
                aria-label="Selecciona la categoría"
            >
                <option value="">— Elige categoría —</option>
            </select>
        </div>
    </div>

    <div id="cr-equipos-list" class="cr-catalog-team-list min-w-0"></div>
</section>
