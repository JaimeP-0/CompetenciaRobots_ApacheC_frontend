<section
    id="cr-inicio-root"
    class="cr-catalog-page cr-catalog-page--inicio"
    data-cr-modulo="1-catalogo"
    aria-label="Competencia de Robots"
>
    <div id="cr-staff-bar" class="cr-staff-bar hidden" aria-label="Sesión personal">
        <span id="cr-staff-bar-label" class="cr-staff-bar-label"></span>
        <button type="button" id="cr-staff-bar-logout" class="cr-staff-bar-logout">Cerrar sesión</button>
    </div>

    <header class="cr-inicio-head">
        <p class="cr-inicio-kicker">Universidad Tecnológica del Norte de Coahuila</p>
        <h1 class="cr-inicio-title">Competencia de Robots</h1>
        <p class="cr-inicio-lead">Registro, consulta y competencia en un solo lugar.</p>
    </header>

    <nav class="cr-inicio-nav" aria-label="Acciones principales">
        <button type="button" class="cr-inicio-hero-card" data-route="/registro">
            <span class="cr-inicio-hero-icon" data-cr-icon="clipboard-document-check" aria-hidden="true"></span>
            <span class="cr-inicio-hero-text">
                <span class="cr-inicio-hero-title">Registrar robots</span>
                <span class="cr-inicio-hero-meta">Verificación en pista · jueces</span>
            </span>
            <span class="cr-inicio-hero-arrow" aria-hidden="true">→</span>
        </button>

        <section class="cr-inicio-section" aria-label="Consultar">
            <h2 class="cr-inicio-section-title">Consultar</h2>
            <div class="cr-inicio-grid">
                <button type="button" class="cr-inicio-mini-card" data-route="/categorias">
                    <span class="cr-inicio-mini-icon" data-cr-icon="squares-2x2" aria-hidden="true"></span>
                    <span class="cr-inicio-mini-label">Categorías</span>
                </button>
                <button type="button" class="cr-inicio-mini-card" data-route="/equipos">
                    <span class="cr-inicio-mini-icon" data-cr-icon="user-group" aria-hidden="true"></span>
                    <span class="cr-inicio-mini-label">Equipos</span>
                </button>
                <button type="button" class="cr-inicio-mini-card" data-route="/validados">
                    <span class="cr-inicio-mini-icon" data-cr-icon="check-circle" aria-hidden="true"></span>
                    <span class="cr-inicio-mini-label">Validados</span>
                </button>
            </div>
        </section>

        <section class="cr-inicio-section" aria-label="Competencia">
            <h2 class="cr-inicio-section-title">Competencia</h2>
            <button type="button" class="cr-inicio-comp-card cr-inicio-comp-card--live" data-route="/visitante">
                <span class="cr-inicio-comp-icon" data-cr-icon="signal" aria-hidden="true"></span>
                <span class="cr-inicio-comp-text">
                    <span class="cr-inicio-comp-title">Encuentros en vivo</span>
                    <span class="cr-inicio-comp-meta">Dashboard público · sin login</span>
                </span>
                <span class="cr-inicio-comp-arrow" aria-hidden="true">→</span>
            </button>
            <button type="button" class="cr-inicio-comp-card" data-route="/match">
                <span class="cr-inicio-comp-icon" data-cr-icon="trophy" aria-hidden="true"></span>
                <span class="cr-inicio-comp-text">
                    <span class="cr-inicio-comp-title">Partidas y resultados</span>
                    <span class="cr-inicio-comp-meta">Velocista · minisumo · fútbol 2v2</span>
                </span>
                <span class="cr-inicio-comp-arrow" aria-hidden="true">→</span>
            </button>
        </section>
    </nav>
</section>
