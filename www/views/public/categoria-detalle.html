<section
    id="cr-cat-detalle-root"
    class="cr-catalog-page cr-catalog-page--inner"
    aria-label="Detalle de categoría"
>
    <button type="button" data-back data-back-fallback="/categorias" class="cr-catalog-back" aria-label="Volver">←</button>

    <header class="cr-page-head">
        <p class="cr-page-kicker">Consultar</p>
        <h1 class="cr-page-title">Reglamento</h1>
        <p class="cr-page-lead">Reglas y requisitos de la modalidad seleccionada.</p>
    </header>

    <div class="cr-catalog-card-block">
        <div class="cr-catalog-card-block-h">
            <h2 id="cr-cat-detalle-titulo" class="cr-catalog-card-block-h-title cr-catalog-card-block-h-title--dynamic">Cargando…</h2>
        </div>
        <div id="cr-cat-detalle-reglas" class="cr-catalog-card-block-body min-w-0"></div>
    </div>

    <div class="flex flex-col gap-3 sm:flex-row">
        <button
            id="cr-cat-detalle-equipos-btn"
            type="button"
            class="cr-app-btn cr-app-btn--primary min-h-12 flex-1 text-sm sm:text-base"
            data-route="/equipos"
        >
            Ver equipos inscritos
        </button>
        <button type="button" class="cr-app-btn cr-app-btn--secondary min-h-12 flex-1 text-sm sm:text-base" data-route="/categorias">
            Otra categoría
        </button>
    </div>
</section>
