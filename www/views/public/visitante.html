<section
    id="cr-visitante-root"
    class="cr-visitante-dash"
    data-cr-modulo="1-catalogo"
    aria-label="Dashboard en vivo"
>
    <header class="cr-visitante-hero">
        <div class="cr-visitante-hero-glow" aria-hidden="true"></div>

        <div class="cr-visitante-hero-row">
            <div class="cr-visitante-hero-brand">
                <p class="cr-visitante-hero-kicker">
                    <span class="cr-visitante-live-dot" aria-hidden="true"></span>
                    En vivo
                </p>
                <h1 class="cr-visitante-hero-title">UT Arena</h1>
                <p class="cr-visitante-hero-lead">Encuentros y resultados del evento</p>
            </div>
        </div>

        <div id="cr-visitante-staff-bar" class="cr-visitante-staff-bar hidden" aria-label="Sesión staff">
            <div class="cr-visitante-staff-bar-inner">
                <span class="cr-visitante-staff-avatar" aria-hidden="true"></span>
                <p id="cr-visitante-staff-label" class="cr-visitante-staff-text"></p>
                <button
                    type="button"
                    id="cr-visitante-staff-logout"
                    class="cr-visitante-staff-link hidden"
                >
                    Cerrar sesión
                </button>
            </div>
        </div>

        <div class="cr-visitante-toolbar" aria-label="Filtros del tablero">
            <label class="cr-visitante-field">
                <span class="cr-visitante-field-label">Categoría</span>
                <select id="cr-visitante-cat" class="cr-visitante-field-control">
                    <option value="">Todas las categorías</option>
                </select>
            </label>
            <label class="cr-visitante-field cr-visitante-dash-filter--school">
                <span class="cr-visitante-field-label">Tu escuela</span>
                <select
                    id="cr-visitante-school"
                    class="cr-visitante-field-control cr-visitante-dash-school-input"
                >
                    <option value="">Selecciona tu escuela</option>
                </select>
            </label>
            <p id="cr-visitante-school-hint" class="cr-visitante-toolbar-hint" aria-live="polite"></p>
        </div>

        <div id="cr-visitante-official-controls" class="cr-visitante-official-controls hidden" aria-label="Controles oficial">
            <label class="cr-visitante-qr-toggle">
                <input id="cr-visitante-qr-enabled" type="checkbox" />
            </label>
        </div>
    </header>

    <main class="cr-visitante-body">
        <section class="cr-visitante-panel cr-visitante-panel--live" aria-labelledby="cr-visitante-live-title">
            <header class="cr-visitante-panel-head">
                <h2 id="cr-visitante-live-title" class="cr-visitante-panel-title">
                    <span class="cr-visitante-panel-icon" data-cr-icon="signal" aria-hidden="true"></span>
                    Ahora en pista
                </h2>
                <span id="cr-visitante-live-count" class="cr-visitante-panel-count" aria-hidden="true">0</span>
            </header>
            <div id="cr-visitante-live" class="cr-visitante-live-grid" aria-live="polite">
                <p class="cr-visitante-empty">Cargando…</p>
            </div>
        </section>

        <aside class="cr-visitante-rail">
            <section class="cr-visitante-panel cr-visitante-panel--queue" aria-labelledby="cr-visitante-upcoming-title">
                <header class="cr-visitante-panel-head">
                    <h2 id="cr-visitante-upcoming-title" class="cr-visitante-panel-title">Próximos</h2>
                    <span id="cr-visitante-upcoming-count" class="cr-visitante-panel-count" aria-hidden="true">0</span>
                </header>
                <div id="cr-visitante-upcoming" class="cr-visitante-queue" aria-live="polite"></div>
            </section>

            <section class="cr-visitante-panel cr-visitante-panel--results" aria-labelledby="cr-visitante-recent-title">
                <header class="cr-visitante-panel-head">
                    <h2 id="cr-visitante-recent-title" class="cr-visitante-panel-title">Últimos resultados</h2>
                    <span id="cr-visitante-recent-count" class="cr-visitante-panel-count" aria-hidden="true">0</span>
                </header>
                <div id="cr-visitante-recent" class="cr-visitante-queue" aria-live="polite"></div>
            </section>
        </aside>
    </main>

    <div id="cr-visitante-qr-overlay" class="cr-visitante-qr-overlay hidden" aria-live="polite" aria-hidden="true">
        <div class="cr-visitante-qr-card">
            <img
                class="cr-visitante-qr-image"
                src="img/qbrandr-whgeP8Pu.png"
                alt="QR para abrir utarena.online/visitante"
            />
            <p id="cr-visitante-qr-countdown" class="cr-visitante-qr-countdown" aria-live="polite"></p>
        </div>
    </div>

</section>
