<section
    id="cr-validados-root"
    class="cr-catalog-page cr-catalog-page--inner cr-catalog-page--wide cr-validados-page"
    data-cr-modulo="1-catalogo"
    aria-label="Equipos verificados"
>
    <header class="cr-page-hero">
        <div class="cr-page-hero-icon" data-cr-icon="check-circle" aria-hidden="true"></div>
        <div class="cr-page-hero-text">
            <p class="cr-page-kicker">Competencia</p>
            <h1 class="cr-page-title">Equipos validados</h1>
            <p class="cr-page-lead">Robots que pasaron la verificación en pista, listos para competir.</p>
        </div>
    </header>

    <section class="cr-match-setup-card" aria-label="Filtrar equipos validados">
        <form id="f-validados-filtro" class="cr-validados-filtro-form" action="#" method="get">
            <span class="cr-validados-filtro-icon" data-cr-icon="magnifying-glass" aria-hidden="true"></span>
            <div class="cr-validados-filtro-field cr-validados-filtro-field--grow">
                <label class="cr-admin-label" for="cr-validados-buscar">Buscar</label>
                <input
                    id="cr-validados-buscar"
                    type="search"
                    class="cr-admin-input"
                    placeholder="Nombre, escuela o tutor…"
                    autocomplete="off"
                />
            </div>
            <div class="cr-validados-filtro-field cr-validados-filtro-field--cat">
                <label class="cr-admin-label" for="cr-validados-cat">Categoría</label>
                <select id="cr-validados-cat" class="cr-admin-select">
                    <option value="">Todas</option>
                </select>
            </div>
            <button type="submit" class="cr-app-btn cr-app-btn--primary cr-validados-filtro-btn">Filtrar</button>
        </form>
    </section>

    <p id="cr-validados-count" class="cr-validados-summary hidden" aria-live="polite"></p>

    <div id="cr-validados-list" class="cr-validados-list" aria-busy="true">
        <p class="cr-validados-loading">Cargando equipos validados…</p>
    </div>
</section>
