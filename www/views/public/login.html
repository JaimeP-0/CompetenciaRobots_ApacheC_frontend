<section
    id="cr-staff-login-root"
    class="cr-catalog-page cr-catalog-page--inner cr-staff-login-page"
    aria-label="Inicio de sesión personal"
>
    <header class="cr-page-head cr-staff-login-head">
        <p class="cr-page-kicker">Competencia de Robots</p>
        <h1 class="cr-page-title">Acceso personal</h1>
        <p class="cr-page-lead">Jueces y árbitros: usa el usuario que te asignaron.</p>
    </header>

    <section class="cr-match-setup-card cr-staff-login-card" aria-labelledby="staff-login-heading">
        <h2 id="staff-login-heading" class="cr-page-section-title">Iniciar sesión</h2>

        <form id="f-staff-login" class="cr-staff-login-form" autocomplete="on" novalidate>
            <div class="cr-staff-login-field">
                <label class="cr-admin-label" for="staff-usuario">Usuario</label>
                <input
                    id="staff-usuario"
                    name="usuario"
                    type="text"
                    class="cr-admin-input"
                    autocomplete="username"
                    autocapitalize="off"
                    spellcheck="false"
                    required
                />
            </div>
            <div class="cr-staff-login-field">
                <label class="cr-admin-label" for="staff-password">Contraseña</label>
                <input
                    id="staff-password"
                    name="password"
                    type="password"
                    class="cr-admin-input"
                    autocomplete="current-password"
                    required
                />
            </div>
            <p id="staff-login-error" class="cr-admin-error hidden" role="alert" aria-live="assertive"></p>
            <button id="btn-staff-login" type="submit" class="cr-admin-btn cr-admin-btn--primary w-full">
                Entrar
            </button>
        </form>
    </section>

    <p class="cr-staff-login-skip-wrap">
        <button type="button" class="cr-staff-login-skip" data-route="/inicio">← Volver al inicio público</button>
    </p>
    <p class="cr-staff-login-skip-wrap">
        <button type="button" id="btn-staff-skip-login" class="cr-staff-login-skip" data-route="/dashboard">
            Continuar sin iniciar sesión — ver dashboard público
        </button>
    </p>
</section>
