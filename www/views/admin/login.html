<section
    id="admin-login-root"
    class="cr-catalog-page cr-catalog-page--inner cr-admin-shell cr-admin-shell--login"
    aria-label="Inicio de sesión administración"
>
    <button type="button" data-back data-back-fallback="/" class="cr-catalog-back" aria-label="Volver">←</button>

    <div class="cr-admin-shell-inner cr-admin-shell-inner--narrow">
        <header class="cr-page-head">
            <p class="cr-page-kicker">Competencia de Robots</p>
            <h1 class="cr-page-title">Administración</h1>
            <p class="cr-page-lead">Acceso restringido para personal autorizado.</p>
        </header>

        <section class="cr-match-setup-card cr-admin-block" aria-labelledby="admin-login-heading">
            <h2 id="admin-login-heading" class="cr-page-section-title">Iniciar sesión</h2>

            <form id="f-admin-login" class="cr-admin-form" action="#" method="post" autocomplete="on" novalidate>
                <div class="cr-admin-field">
                    <label class="cr-admin-label" for="admin-usuario">Usuario</label>
                    <input
                        id="admin-usuario"
                        name="usuario"
                        type="text"
                        class="cr-admin-input"
                        autocomplete="username"
                        autocapitalize="off"
                        spellcheck="false"
                        required
                    />
                </div>
                <div class="cr-admin-field">
                    <label class="cr-admin-label" for="admin-password">Contraseña</label>
                    <input
                        id="admin-password"
                        name="password"
                        type="password"
                        class="cr-admin-input"
                        autocomplete="current-password"
                        required
                    />
                </div>
                <p id="admin-login-error" class="cr-admin-error hidden" role="alert" aria-live="assertive"></p>
                <button id="btn-admin-login" type="submit" class="cr-admin-btn cr-admin-btn--primary w-full">
                    Entrar
                </button>
            </form>
        </section>
    </div>
</section>
