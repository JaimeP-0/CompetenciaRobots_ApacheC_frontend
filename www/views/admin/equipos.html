<section
    id="admin-equipos-root"
    class="cr-catalog-page cr-catalog-page--inner cr-catalog-page--wide cr-admin-shell cr-admin-equipos-page"
    data-cr-modulo="3-equipos-registro"
    aria-label="Asignar categoría a equipos"
>
    <div class="cr-admin-shell-inner cr-admin-shell-inner--wide">
        <nav class="cr-admin-topbar" aria-label="Secciones de administración">
            <div data-admin-subnav></div>
        </nav>

        <header class="cr-page-hero cr-admin-cats-hero">
            <div class="cr-page-hero-icon cr-admin-cats-hero-icon" data-cr-icon="user-group" aria-hidden="true"></div>
            <div class="cr-page-hero-text cr-admin-cats-hero-text">
                <p class="cr-page-kicker">Gestión</p>
                <h1 class="cr-page-title">Equipos y miembros</h1>
            </div>
        </header>

        <p id="admin-equipos-msg" class="cr-admin-msg cr-admin-cats-toast hidden" role="status" aria-live="polite"></p>

        <div class="cr-admin-mode-tabs" role="tablist" aria-label="Acciones de equipos">
            <button
                type="button"
                id="admin-equipos-tab-buscar"
                class="cr-admin-mode-tab cr-admin-mode-tab--active"
                role="tab"
                aria-selected="true"
                aria-controls="admin-equipos-panel-buscar"
                data-admin-equipos-mode="buscar"
            >
                Buscar equipos
            </button>
            <button
                type="button"
                id="admin-equipos-tab-agregar"
                class="cr-admin-mode-tab"
                role="tab"
                aria-selected="false"
                aria-controls="admin-equipos-panel-agregar"
                data-admin-equipos-mode="agregar"
            >
                Agregar equipos
            </button>
        </div>

        <section
            id="admin-equipos-panel-agregar"
            class="cr-match-setup-card cr-admin-cats-add cr-admin-equipos-nuevo hidden"
            role="tabpanel"
            aria-labelledby="admin-equipos-tab-agregar"
            hidden
        >
            <h2 class="cr-page-section-title">Nuevo equipo</h2>
            <form id="f-admin-nuevo-equipo" class="cr-admin-equipos-nuevo-form" action="#" method="post">
                <div class="cr-admin-equipos-nuevo-grid">
                    <div class="cr-admin-equipos-nuevo-field">
                        <label class="cr-admin-label" for="admin-nuevo-equipo-nombre">Nombre del equipo</label>
                        <input
                            id="admin-nuevo-equipo-nombre"
                            type="text"
                            class="cr-admin-input"
                            placeholder="Ej. RoboTitans"
                            required
                        />
                    </div>
                    <div class="cr-admin-equipos-nuevo-field">
                        <label class="cr-admin-label" for="admin-nuevo-equipo-escuela">Escuela</label>
                        <input id="admin-nuevo-equipo-escuela" type="text" class="cr-admin-input" placeholder="Opcional" />
                    </div>
                    <div class="cr-admin-equipos-nuevo-field">
                        <label class="cr-admin-label" for="admin-nuevo-equipo-grado">Grado / grupo</label>
                        <input id="admin-nuevo-equipo-grado" type="text" class="cr-admin-input" placeholder="Opcional" />
                    </div>
                    <div class="cr-admin-equipos-nuevo-field">
                        <label class="cr-admin-label" for="admin-nuevo-equipo-tutor">Tutor</label>
                        <input id="admin-nuevo-equipo-tutor" type="text" class="cr-admin-input" placeholder="Opcional" />
                    </div>
                    <div class="cr-admin-equipos-nuevo-field">
                        <label class="cr-admin-label" for="admin-nuevo-equipo-cat">Categoría</label>
                        <select id="admin-nuevo-equipo-cat" class="cr-admin-select">
                            <option value="">— Sin categoría —</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="cr-admin-btn cr-admin-btn--primary cr-admin-equipos-nuevo-btn">
                    Agregar equipo
                </button>
            </form>
        </section>

        <section
            id="admin-equipos-panel-buscar"
            class="cr-match-setup-card cr-admin-cats-add cr-admin-equipos-filtros"
            role="tabpanel"
            aria-labelledby="admin-equipos-tab-buscar"
        >
            <h2 class="cr-page-section-title">Buscar equipos</h2>
            <p class="cr-admin-equipos-filtros-hint">Elige una categoría y luego busca dentro de ella.</p>
            <form id="f-admin-equipos-filtro" class="cr-admin-cats-add-form cr-admin-equipos-filtros-form" action="#" method="get">
                <div class="cr-admin-equipos-filtros-cat">
                    <label class="cr-admin-label" for="admin-equipos-filtro-cat">Categoría</label>
                    <select id="admin-equipos-filtro-cat" class="cr-admin-select" required>
                        <option value="">Elige una categoría…</option>
                    </select>
                </div>
                <div class="cr-admin-cats-add-field">
                    <label class="cr-admin-label" for="admin-equipos-buscar">Buscar</label>
                    <input
                        id="admin-equipos-buscar"
                        type="search"
                        class="cr-admin-input"
                        placeholder="Nombre, escuela o tutor…"
                        autocomplete="off"
                        disabled
                    />
                </div>
                <button type="submit" id="admin-equipos-filtro-btn" class="cr-admin-btn cr-admin-btn--primary cr-admin-cats-add-btn" disabled>
                    Buscar
                </button>
            </form>
        </section>

        <section class="cr-admin-cats-list-section" aria-labelledby="admin-equipos-lista-title">
            <div class="cr-admin-cats-list-head">
                <h2 id="admin-equipos-lista-title" class="cr-page-section-title">Equipos registrados</h2>
                <span id="admin-equipos-count" class="cr-admin-cats-count" aria-live="polite">…</span>
            </div>

            <div id="admin-equipos-pagination" class="cr-admin-equipos-pagination hidden" aria-label="Paginación de equipos"></div>

            <div id="admin-equipos-list" class="cr-admin-equipo-list" aria-busy="false">
                <div class="cr-admin-cats-empty">
                    <span class="cr-admin-cats-empty-icon" data-cr-icon="tag" aria-hidden="true"></span>
                    <p class="cr-admin-cats-empty-title">Elige una categoría</p>
                    <p class="cr-admin-cats-empty-desc">Selecciona una categoría arriba y pulsa Buscar para ver sus equipos.</p>
                </div>
            </div>

            <div id="admin-equipos-pagination-foot" class="cr-admin-equipos-pagination hidden" aria-label="Paginación de equipos"></div>
        </section>

        <footer class="cr-admin-footer">
            <button type="button" class="cr-admin-btn cr-admin-btn--ghost" data-admin-logout>Cerrar sesión</button>
        </footer>
    </div>
</section>
