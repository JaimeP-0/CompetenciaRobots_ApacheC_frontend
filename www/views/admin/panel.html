<section id="admin-panel-root" class="cr-admin-shell cr-admin-page" aria-label="Panel de administración">
    <button type="button" data-route="/" class="cr-catalog-back" aria-label="Salir al inicio público">←</button>

    <div class="cr-admin-shell-inner">
        <nav class="cr-admin-topbar" aria-label="Secciones de administración">
            <div data-admin-subnav></div>
        </nav>

        <header class="cr-admin-page-head">
            <p class="cr-catalog-kicker">Administración</p>
            <h1 class="cr-catalog-title">Panel</h1>
            <p id="admin-saludo" class="cr-catalog-lead hidden" aria-live="polite"></p>
        </header>

        <section class="cr-admin-block" aria-label="Resumen">
            <h2 class="cr-admin-block-title">Resumen</h2>
            <div class="cr-admin-stats">
                <article class="cr-admin-stat-card">
                    <p class="cr-admin-stat-k">Equipos</p>
                    <p id="admin-stat-equipos" class="cr-admin-stat-v">…</p>
                </article>
                <article class="cr-admin-stat-card">
                    <p class="cr-admin-stat-k">Categorías</p>
                    <p id="admin-stat-categorias" class="cr-admin-stat-v">…</p>
                </article>
            </div>
        </section>

        <section class="cr-admin-block cr-admin-block--card" aria-labelledby="admin-gestion-title">
            <h2 id="admin-gestion-title" class="cr-admin-block-title">Gestión</h2>
            <div class="cr-admin-tiles">
                <a href="#/admin/categorias" class="cr-admin-tile cr-admin-tile--primary" data-route="/admin/categorias">
                    <span class="cr-admin-tile-title">Categorías y reglas</span>
                    <span class="cr-admin-tile-desc">Crear categorías y su reglamento</span>
                    <span class="cr-admin-tile-arrow" aria-hidden="true">→</span>
                </a>
                <a href="#/admin/equipos" class="cr-admin-tile" data-route="/admin/equipos">
                    <span class="cr-admin-tile-title">Equipos</span>
                    <span class="cr-admin-tile-desc">Alta de equipos, miembros y categoría</span>
                    <span class="cr-admin-tile-arrow" aria-hidden="true">→</span>
                </a>
            </div>
        </section>

        <footer class="cr-admin-footer">
            <button type="button" id="btn-admin-logout" class="cr-app-btn cr-app-btn--outline sm:ml-auto sm:w-auto">
                Cerrar sesión
            </button>
        </footer>
    </div>
</section>
