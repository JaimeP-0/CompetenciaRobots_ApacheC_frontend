<section
    id="admin-panel-root"
    class="cr-catalog-page cr-catalog-page--inner cr-catalog-page--wide cr-admin-shell"
    aria-label="Panel de administración"
>
    <div class="cr-admin-shell-inner">
        <nav class="cr-admin-topbar" aria-label="Secciones de administración">
            <div data-admin-subnav></div>
        </nav>

        <header class="cr-page-hero cr-admin-cats-hero">
            <div class="cr-page-hero-icon cr-admin-cats-hero-icon" data-cr-icon="squares-2x2" aria-hidden="true"></div>
            <div class="cr-page-hero-text cr-admin-cats-hero-text">
                <p class="cr-page-kicker">Administración</p>
                <h1 class="cr-page-title">Panel</h1>
                <p id="admin-saludo" class="cr-page-lead hidden" aria-live="polite"></p>
            </div>
        </header>

        <section class="cr-admin-block" aria-label="Resumen">
            <h2 class="cr-page-section-title">Resumen</h2>
            <div class="cr-admin-stats">
                <article class="cr-admin-stat-card">
                    <p class="cr-admin-stat-k">Equipos</p>
                    <p id="admin-stat-equipos" class="cr-admin-stat-v">…</p>
                </article>
                <article class="cr-admin-stat-card">
                    <p class="cr-admin-stat-k">Categorías</p>
                    <p id="admin-stat-categorias" class="cr-admin-stat-v">…</p>
                </article>
            </div>
        </section>

        <section class="cr-match-setup-card cr-admin-block" aria-labelledby="admin-gestion-title">
            <h2 id="admin-gestion-title" class="cr-page-section-title">Gestión</h2>
            <div class="cr-admin-tiles">
                <a href="#/admin/categorias" class="cr-inicio-comp-card cr-admin-tile cr-admin-tile--primary" data-route="/admin/categorias">
                    <span class="cr-inicio-comp-icon" data-cr-icon="squares-2x2" aria-hidden="true"></span>
                    <span class="cr-inicio-comp-text">
                        <span class="cr-inicio-comp-title">Categorías y reglas</span>
                        <span class="cr-inicio-comp-meta">Crear categorías y su reglamento</span>
                    </span>
                    <span class="cr-inicio-comp-arrow" aria-hidden="true">→</span>
                </a>
                <a href="#/admin/equipos" class="cr-inicio-comp-card cr-admin-tile" data-route="/admin/equipos">
                    <span class="cr-inicio-comp-icon" data-cr-icon="user-group" aria-hidden="true"></span>
                    <span class="cr-inicio-comp-text">
                        <span class="cr-inicio-comp-title">Equipos</span>
                        <span class="cr-inicio-comp-meta">Alta de equipos, miembros y categoría</span>
                    </span>
                    <span class="cr-inicio-comp-arrow" aria-hidden="true">→</span>
                </a>
            </div>
        </section>

        <footer class="cr-admin-footer">
            <button type="button" class="cr-admin-btn cr-admin-btn--ghost" data-admin-logout>Cerrar sesión</button>
        </footer>
    </div>
</section>
